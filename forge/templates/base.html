<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}OOC Forge{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='forge.css') }}"></head><body><div class="shell"><header class="top"><a class="brand" href="{{ url_for('dashboard') if session.get('admin') else url_for('login') }}"><img src="{{ url_for('static', filename='ooc-logo.svg') }}" alt="OOC"><div><strong>OOC</strong><div class="eyebrow">Forge</div></div></a>{% if session.get('admin') %}<nav class="nav"><a href="{{ url_for('create') }}">Create</a><a href="{{ url_for('creative_sessions') }}">Sessions</a><a href="{{ url_for('models') }}">Models</a><a href="{{ url_for('jobs') }}">Jobs</a><a href="{{ url_for('ooc_settings') }}">OOC System</a><a href="{{ url_for('system') }}">System</a><form method="post" action="{{ url_for('logout') }}"><button>Sign out</button></form></nav>{% endif %}</header>{% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</div></body></html>
