<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}FORGE{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='forge.css') }}"></head><body><div class="shell"><header class="top"><a class="brand" href="{{ url_for('dashboard') if session.get('admin') else url_for('login') }}"><img src="{{ url_for('static', filename='ooc-logo.svg') }}" alt=""><strong>FORGE</strong></a>{% if session.get('admin') %}<nav class="nav desktop-nav" aria-label="Primary"><a href="{{ url_for('create') }}">Create</a><a href="{{ url_for('creative_sessions') }}">Sessions</a><a href="{{ url_for('models') }}">Models</a><a href="{{ url_for('video_derivative.creative_models') }}">Creative Models</a><a href="{{ url_for('jobs') }}">Jobs</a><a href="{{ url_for('ooc_settings') }}">OOC System</a><a href="{{ url_for('system') }}">System</a><form method="post" action="{{ url_for('logout') }}"><button>Sign out</button></form></nav><details class="mobile-nav"><summary aria-label="Open navigation"><span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span></summary><nav class="mobile-nav-panel" aria-label="Mobile navigation"><a href="{{ url_for('create') }}">Create</a><a href="{{ url_for('creative_sessions') }}">Sessions</a><a href="{{ url_for('models') }}">Models</a><a href="{{ url_for('video_derivative.creative_models') }}">Creative Models</a><a href="{{ url_for('jobs') }}">Jobs</a><a href="{{ url_for('ooc_settings') }}">OOC System</a><a href="{{ url_for('system') }}">System</a><form method="post" action="{{ url_for('logout') }}"><button class="secondary">Sign out</button></form></nav></details>{% endif %}</header>{% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</div><script>(function(){const autoRefreshMeta=document.querySelector('meta[http-equiv="refresh"]');if(!autoRefreshMeta)return;const seconds=Math.max(1,parseFloat(autoRefreshMeta.getAttribute('content')||'3')||3);autoRefreshMeta.remove();let editing=false;let dirty=false;const isEditable=function(target){return target&&target.matches&&target.matches('input:not([type="hidden"]), textarea, select');};document.addEventListener('focusin',function(event){if(isEditable(event.target))editing=true;});document.addEventListener('focusout',function(event){if(isEditable(event.target))setTimeout(function(){editing=isEditable(document.activeElement);},0);});document.addEventListener('input',function(event){if(isEditable(event.target))dirty=true;});document.addEventListener('change',function(event){if(isEditable(event.target))dirty=true;});document.addEventListener('submit',function(){dirty=false;});const tick=function(){if(!editing&&!dirty){window.location.reload();return;}window.setTimeout(tick,seconds*1000);};window.setTimeout(tick,seconds*1000);})();</script></body></html>
