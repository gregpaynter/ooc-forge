{% extends 'base.html' %}{% block title %}Jobs · OOC Forge{% endblock %}{% block content %}<section class="hero"><p class="eyebrow">Local queue</p><h1>Jobs</h1></section><section class="panel"><table><thead><tr><th>Created</th><th>Source</th><th>Type</th><th>Status</th></tr></thead><tbody>{% for item in jobs %}<tr><td><a href="{{ url_for('job',job_id=item.id) }}">{{ item.created_at }}</a></td><td>{{ item.source }}</td><td>{{ item.job_type }}</td><td>{{ item.status }}</td></tr>{% else %}<tr><td colspan="4">No jobs.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
