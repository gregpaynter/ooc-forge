name: OOC Forge CI

on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Compile Python
        run: python -m compileall -q forge tests

      - name: Validate appliance files
        run: |
          bash -n \
            scripts/forge-doctor.sh \
            scripts/install-local.sh \
            scripts/install-comfyui-runtime \
            scripts/install-prompt-runtime \
            scripts/ooc-forge-appliance-policy \
            scripts/ooc-forge-git-update \
            scripts/ooc-forge-model-install \
            scripts/ooc-forge-upscale-model-install \
            scripts/ooc-forge-prompt-model-install \
            scripts/ooc-forge-video-model-install \
            scripts/ooc-forge-audio-model-install
          sudo visudo -cf systemd/ooc-forge-maintenance.sudoers >/dev/null
          test -s systemd/ooc-forge-git-update.service
          test -s systemd/ooc-forge-appliance-policy.service
          test -s systemd/ooc-forge-model-install.service
          test -s systemd/ooc-forge-upscale-model-install.service
          test -s systemd/ooc-forge-prompt-model-install.service
          test -s systemd/ooc-forge-video-model-install.service
          test -s systemd/ooc-forge-audio-model-install.service
          test -s systemd/comfyui.service
          python -m json.tool workflows/manual-image/manifest.json >/dev/null
          python -m json.tool workflows/manual-image/workflow.json >/dev/null
          python -m json.tool workflows/manual-image-reference/manifest.json >/dev/null
          python -m json.tool workflows/manual-image-reference/workflow.json >/dev/null
          python -m json.tool workflows/print-upscale/manifest.json >/dev/null
          python -m json.tool workflows/print-upscale/workflow.json >/dev/null
          python -m json.tool workflows/video-wan22-ti2v/manifest.json >/dev/null
          python -m json.tool workflows/video-wan22-ti2v/workflow.json >/dev/null
          python -m json.tool workflows/audio-stable-audio3/manifest.json >/dev/null
          python -m json.tool workflows/audio-stable-audio3/workflow.json >/dev/null
          python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          assert project['project']['name'] == 'ooc-forge'
          assert project['project']['version'] == '0.1.1'
          PY

      - name: Persistence and maintenance tests
        run: python -m pytest -q
