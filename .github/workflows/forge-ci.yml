name: OOC Forge CI

on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Compile Python
        run: python -m compileall -q forge tests

      - name: Validate appliance files
        run: |
          bash -n scripts/forge-doctor.sh scripts/install-local.sh scripts/ooc-forge-git-update
          sudo visudo -cf systemd/ooc-forge-maintenance.sudoers >/dev/null
          test -s systemd/ooc-forge-git-update.service
          python -m json.tool workflows/manual-image/manifest.json >/dev/null
          python -m json.tool workflows/manual-image/workflow.json >/dev/null
          python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          assert project['project']['name'] == 'ooc-forge'
          assert project['project']['version'] == '0.1.0'
          PY

      - name: Persistence and maintenance tests
        run: python -m pytest -q
