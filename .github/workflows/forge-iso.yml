name: OOC Forge ISO

on:
  pull_request:
    paths:
      - 'iso/**'
      - 'systemd/**'
      - 'nginx/**'
      - 'scripts/**'
      - 'workflows/**'
      - 'forge/storage.py'
      - 'forge/__init__.py'
      - 'pyproject.toml'
      - '.github/workflows/forge-iso.yml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ISO source
        run: ./iso/validate.sh

  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim runner disk for bundled CUDA runtime
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc 2>/dev/null || true
          docker system prune -af || true
          df -h

      - name: Build inside Debian 13
        run: |
          mkdir -p build
          set +e
          set -o pipefail

          docker run --rm --privileged \
            -e OOC_FORGE_SOURCE_REF="${GITHUB_SHA}" \
            -v "${PWD}:/work" \
            -w /work \
            debian:13 \
            bash -lc '
              set -euxo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debootstrap rsync xorriso squashfs-tools \
                grub-common grub-efi-amd64-bin grub-efi-amd64-signed grub-pc-bin \
                isolinux syslinux-common syslinux-utils \
                fdisk mtools dosfstools git python3
              ./iso/build.sh
            ' 2>&1 | tee build/ci-live-build.log

          status=${PIPESTATUS[0]}
          set +o pipefail
          set -e

          if [ "$status" -ne 0 ]; then
            echo "=== OOC Forge live-build error digest ==="
            grep -Ei '(^E:|^W:|ERROR|Error|Unable|not found|cannot|failed|Failure|No space|permission denied|dpkg: error|apt.*error|dkms|nvidia|grub|comfy|torch|cuda|lb .*failed)' \
              build/ci-live-build.log | tail -n 140 || true
            echo "=== OOC Forge live-build final 140 lines ==="
            tail -n 140 build/ci-live-build.log || true
            exit "$status"
          fi

      - name: Upload live-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ooc-forge-live-build-log-${{ github.sha }}
          path: |
            build/ci-live-build.log
            build/iso/build.log
          if-no-files-found: warn

      - name: Validate ISO artifacts
        run: |
          sudo apt-get update
          sudo apt-get install -y fdisk ovmf qemu-system-x86 xorriso squashfs-tools
          test -s dist/ooc-forge-*.iso
          (
            cd dist
            sha256sum -c ooc-forge-*.iso.sha256
          )
          python -m json.tool dist/ooc-forge-*.iso.manifest.json >/dev/null
          python - <<'PY'
          import glob
          import json

          manifest_path = glob.glob('dist/ooc-forge-*.iso.manifest.json')[0]
          value = json.load(open(manifest_path, encoding='utf-8'))
          assert value['version'] == '0.1.1'
          assert value['ssh_server'] is True
          assert value['nouveau_blacklisted'] is True
          assert value['execution_stack']['bundled'] is True
          assert value['execution_stack']['comfyui_version'] == 'v0.34.0'
          assert value['execution_stack']['comfyui_commit'] == '12d5279438bfefc058a269eae805ceab6047777f'
          assert value['execution_stack']['torch_version'] == '2.7.1'
          assert value['execution_stack']['cuda_runtime'] == '12.6'
          assert value['execution_stack']['listen'] == '127.0.0.1:8188'
          PY
          bash ./iso/inspect-boot.sh dist/ooc-forge-*.iso
          bash ./iso/inspect-grub.sh dist/ooc-forge-*.iso

      - name: Inspect bundled appliance runtime
        run: |
          iso=$(find dist -maxdepth 1 -name 'ooc-forge-*.iso' -print -quit)
          run_dir=$(mktemp -d)
          trap 'rm -rf "$run_dir"' EXIT
          xorriso -osirrox on -indev "$iso" -extract /live/filesystem.squashfs "$run_dir/filesystem.squashfs" >/dev/null 2>&1

          unsquashfs -cat "$run_dir/filesystem.squashfs" /etc/ooc-forge/comfyui-runtime.env | grep -Fxq 'COMFYUI_VERSION=v0.34.0'
          unsquashfs -cat "$run_dir/filesystem.squashfs" /etc/ooc-forge/comfyui-runtime.env | grep -Fxq 'TORCH_VERSION=2.7.1'
          unsquashfs -cat "$run_dir/filesystem.squashfs" /etc/ooc-forge/comfyui-runtime.env | grep -Fxq 'PYTORCH_CUDA_VERSION=12.6'
          unsquashfs -cat "$run_dir/filesystem.squashfs" /etc/modprobe.d/blacklist-nouveau.conf | grep -Fxq 'blacklist nouveau'
          unsquashfs -cat "$run_dir/filesystem.squashfs" /etc/systemd/system/comfyui.service | grep -Fq -- '--listen 127.0.0.1 --port 8188'
          unsquashfs -cat "$run_dir/filesystem.squashfs" /usr/local/sbin/ooc-forge-appliance-policy | grep -Fq 'ssh-keygen -A'
          unsquashfs -ll "$run_dir/filesystem.squashfs" | grep -Fq '/opt/ComfyUI/main.py'
          unsquashfs -ll "$run_dir/filesystem.squashfs" | grep -Fq '/opt/ComfyUI/.venv/bin/python'
          unsquashfs -ll "$run_dir/filesystem.squashfs" | grep -Fq '/usr/sbin/sshd'
          unsquashfs -ll "$run_dir/filesystem.squashfs" | grep -Eq '/lib/modules/.*/updates/dkms/(nvidia-current|nvidia)\.ko'
          if unsquashfs -ll "$run_dir/filesystem.squashfs" | grep -Eq '/etc/ssh/ssh_host_(rsa|ecdsa|ed25519)_key$'; then
            echo 'Built ISO must not contain reusable SSH host private keys.' >&2
            exit 1
          fi

      - name: Boot ISO as UEFI USB mass storage
        run: bash ./iso/qemu-uefi-smoke.sh dist/ooc-forge-*.iso

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ooc-forge-boot-diagnostics-${{ github.sha }}
          path: |
            dist/ooc-forge-*.iso.boot-report.txt
            dist/ooc-forge-*.iso.grub-report.txt
            dist/ooc-forge-*.iso.qemu.log
            dist/ooc-forge-*.iso.qemu-serial.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: ooc-forge-iso-${{ github.sha }}
          compression-level: 0
          retention-days: 7
          path: |
            dist/ooc-forge-*.iso
            dist/ooc-forge-*.iso.sha256
            dist/ooc-forge-*.iso.manifest.json
            dist/ooc-forge-*.iso.boot-report.txt
            dist/ooc-forge-*.iso.grub-report.txt
          if-no-files-found: error
