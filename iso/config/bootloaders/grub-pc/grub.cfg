# OOC Forge live-media GRUB entry point.
#
# live-build assembles the live menu entries from --bootappend-live and injects
# them at @LINUX_LIVE@ while building binary/boot/grub/*.cfg. Keep this file
# deliberately small: make the first generated live entry deterministic, give
# unattended media a finite timeout, and mirror GRUB output to COM1 so the
# QEMU/OVMF USB smoke test can distinguish GRUB failures from Linux failures.

set default=0
set timeout=3
set timeout_style=menu

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

echo "OOC_FORGE_GRUB_READY"

# Replaced by live-build with the generated live menuentry block(s). The first
# generated entry inherits --bootappend-live, including the Forge smoke flag and
# serial kernel console used by CI.
@LINUX_LIVE@

# Preserve Debian Installer entries after the live entry. The live entry stays
# index 0 and therefore remains the unattended default used by Forge CI.
if [ -f /boot/grub/install_start.cfg ]; then
  source /boot/grub/install_start.cfg
fi
